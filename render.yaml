services:
  - type: web
    name: terramia
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: terramia-db
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        value: lftjny3e
      - key: CLOUDINARY_API_KEY
        value: "225793857363361"
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false

databases:
  - name: terramia-db
    plan: starter
