{% extends 'admin/base_admin.html' %}
{% block title %}Editar insumo{% endblock %}

{% block content %}
<div class="admin-page-header">
  <h1>Editar insumo</h1>
  <a href="{{ url_for('admin.insumos') }}" class="btn-action btn-action-ghost">← Volver</a>
</div>

<div class="form-section" style="max-width:680px">
  <form action="{{ url_for('admin.insumo_editar', id=insumo.id) }}" method="POST" class="insumo-grid-form">

    <div class="form-group">
      <label>Nombre *</label>
      <input type="text" name="nombre" value="{{ insumo.nombre }}" required>
    </div>

    <div class="form-group">
      <label>Categoría</label>
      <select name="categoria">
        {% for r in categorias %}
        <option value="{{ r.nombre }}" {% if insumo.categoria == r.nombre %}selected{% endif %}>{{ r.nombre|capitalize }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label>Proveedor</label>
      <input type="text" name="proveedor" value="{{ insumo.proveedor or '' }}">
    </div>

    <div class="form-group">
      <label>Unidad *</label>
      <select name="unidad">
        {% for u in ['gr','kg','ml','l','unidad','hoja','cubo','hs','m','cm'] %}
        <option value="{{ u }}" {% if insumo.unidad == u %}selected{% endif %}>{{ u }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label>Precio de compra ($) *</label>
      <input type="number" name="precio_compra" step="0.01" min="0.01"
             value="{{ insumo.precio_compra|float }}" required>
    </div>

    <div class="form-group">
      <label>Cantidad comprada *</label>
      <input type="number" name="cantidad_compra" step="0.0001" min="0.0001"
             value="{{ insumo.cantidad_compra|float }}" required>
    </div>

    <div class="form-group">
      <label>Fecha de compra</label>
      <input type="date" name="fecha_compra"
             value="{{ insumo.fecha_compra.isoformat() if insumo.fecha_compra else '' }}">
    </div>

    <div class="form-group">
      <label>Notas</label>
      <input type="text" name="notas" value="{{ insumo.notas or '' }}">
    </div>

    <div class="insumo-form-actions">
      <button type="submit" class="btn btn-primary">Guardar cambios</button>
      <div class="insumo-ppu-preview" style="font-family:system-ui">
        Precio/unidad actual: <strong>{{ insumo.precio_unidad_fmt }}/{{ insumo.unidad }}</strong>
      </div>
    </div>

  </form>
</div>
{% endblock %}
