<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Terramia</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="admin-body">
  <div class="admin-login-wrap">
    <div class="admin-login-card">
      <span class="logo-script" style="font-size:2rem;color:var(--terracotta)">Terramia</span>
      <h2>Panel de administración</h2>
      {% if error %}<p class="login-error">{{ error }}</p>{% endif %}
      <form method="POST" action="{{ url_for('admin.login') }}">
        <label>Contraseña</label>
        <input type="password" name="password" placeholder="••••••••" autofocus>
        <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
      </form>
      <a href="{{ url_for('tienda.index') }}" class="back-link">← Volver al sitio</a>
    </div>
  </div>
</body>
</html>
