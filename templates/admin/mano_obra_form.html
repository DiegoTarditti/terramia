{% extends 'admin/base_admin.html' %}
{% block title %}Editar mano de obra{% endblock %}

{% block content %}
<div class="admin-page-header">
  <h1>Editar tipo de labor</h1>
  <a href="{{ url_for('admin.mano_de_obra') }}" class="btn-action btn-action-ghost">← Volver</a>
</div>

<div class="form-section" style="max-width:480px">
  <form action="{{ url_for('admin.mano_de_obra_editar', id=mdo.id) }}" method="POST" class="admin-form">
    <div class="form-group">
      <label>Nombre *</label>
      <input type="text" name="nombre" value="{{ mdo.nombre }}" required>
    </div>
    <div class="form-group">
      <label>Tarifa ($/hora) *</label>
      <input type="number" name="tarifa_hora" step="100" min="1"
             value="{{ mdo.tarifa_hora|float|int }}" required>
    </div>
    <div class="form-group">
      <label>Notas</label>
      <input type="text" name="notas" value="{{ mdo.notas or '' }}">
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Guardar cambios</button>
      <a href="{{ url_for('admin.mano_de_obra') }}" class="btn-action btn-action-ghost">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
